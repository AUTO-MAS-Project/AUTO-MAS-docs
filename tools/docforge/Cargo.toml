[package]
name = "docforge"
version = "0.2.0"
edition = "2021"
description = "Portable documentation authoring tool for AUTO-MAS Docs"
license = "MIT"
default-run = "docforge"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
lopdf = "0.34"
pdf-extract = "0.8"
printpdf = "0.7"
pulldown-cmark = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.15"
unicode-width = "0.2"
walkdir = "2.5"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
